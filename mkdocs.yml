site_name: CloudscribeNG Documentation
site_url: https://cloudscribeng.github.io
repo_url: https://github.com/cloudscribeng
repo_name: cloudscribeng

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: blue

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.emoji
  - pymdownx.magiclink

plugins:
  - search
  - autorefs

nav:
  - Home: index.md